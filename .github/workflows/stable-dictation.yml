name: Stable dictation checks

on:
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless test tools
        run: >-
          python -m pip install pytest pytest-cov pytest-mock pytest-timeout
          numpy requests tqdm psutil pynput evdev python-xlib
          flake8 'black>=26,<27' isort
      - name: Check code
        run: |
          make lint
      - name: Run Python suite without desktop or model installation
        env:
          PYTHONPATH: src
        run: python -m pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-python-test-results
          path: test-results.xml
